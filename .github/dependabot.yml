version: 2
updates:
  # pub dependencies — root package + the example app.
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
  - package-ecosystem: pub
    directory: /example
    schedule:
      interval: weekly
    labels: [dependencies]

  # GitHub Actions — third-party action SHAs AND the whuppi/ci shared-CI pins.
  # The whuppi-ci group bundles every whuppi/ci ref (reusable workflows +
  # make-target + capabilities) into ONE bump PR, so a new whuppi/ci release
  # moves them together — mixed internal versions are impossible — and that PR
  # runs this repo's own CI before merge. daily so a ci release is picked up
  # promptly; the consumer still merges on its own schedule.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    labels: [dependencies]
    groups:
      whuppi-ci:
        patterns: ["whuppi/ci"]
