name: device_io
version: 0.0.0
description: >-
  Cross-platform device IO for Flutter. Pick images and files, share via
  the OS sheet, save silently or through the system save dialog, open in
  the default viewer. One API on iOS, Android, macOS, Windows, Linux, web.
homepage: https://github.com/whuppi/device_io
repository: https://github.com/whuppi/device_io
issue_tracker: https://github.com/whuppi/device_io/issues

topics:
  - file-picker
  - share
  - download
  - file-io
  - cross-platform

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Asset/image picking (federated across all six platforms)
  image_picker: ^1.1.2

  # Generic file picking + the system save dialogs behind saveAs.
  # Pinned to the 12 BETA on purpose — do NOT "clean up" to stable 11.x.
  # file_picker 11.x has no Android Gradle Plugin 9.0+ support: under AGP 9+
  # its Kotlin FilePickerPlugin never compiles (11.0.1 only fixed AGP <9.0),
  # so the Android build dies with "cannot find symbol FilePickerPlugin" in
  # GeneratedPluginRegistrant — miguelpruivo/flutter_file_picker#1973. Only
  # 12.0.0-beta.3+ fixed AGP 9+. 12 also raises the iOS min to 14 and win32 to
  # ^6 (the share_plus pin below matches that win32).
  # EXACT pin, no caret: a caret on a pre-release lets pub pull a newer beta,
  # and file_picker's betas churn the exact params we pass — beta.4 deprecated
  # `withData` and `allowMultiple` (both slated for removal) and we still use
  # them. A caret could drop a beta that removes them into device_io AND every
  # consumer unbidden. Bump this line deliberately per beta; switch to ^12.0.0
  # when 12 ships stable (migrating off the deprecated params first).
  file_picker: 12.0.0-beta.7

  # OS share sheet — REGISTRATION ONLY: code imports go through the
  # platform interface below, because this barrel's desktop impls pin
  # url_launcher_linux/windows and poison pub.dev platform attribution.
  # Held at 13 (win32 ^6) to match file_picker 12-beta's win32 ^6 above —
  # the two move together when file_picker 12 ships stable.
  share_plus: ^13.2.0

  # The share_plus API surface this package actually imports
  share_plus_platform_interface: ^7.1.0

  # Downloads / documents directories for silent native saves
  path_provider: ^2.1.5

  # Web APIs — blob downloads, Web Share, File System Access types
  web: ^1.1.0

  # Native file-open for iOS/Android — REGISTRATION ONLY: its method
  # channel is invoked directly (the plugin declares just android + ios,
  # so importing its Dart would drop desktop platform attribution)
  open_filex: ^4.7.0

  # Full MIME database behind the curated maps in mime_types.dart
  mime: ^2.0.0

  # Annotations (@immutable)
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Test runner. Ceiling on Flutter 3.44.4: flutter_test pins
  # test_api 0.7.11, and test >=1.31.2 needs 0.7.13.
  test: ^1.31.0

  # Fakes path_provider in download-adapter tests — no platform channels.
  # Dev-only: ships nowhere.
  path_provider_platform_interface: ^2.1.3

  # Lint rules
  flutter_lints: ^6.0.0

  # Test fakes substitute the plugins at their platform-interface seam
  # (MockPlatformInterfaceMixin + the interface types). Dev-only: tests
  # never import the plugins themselves — a make test-guards rule.
  plugin_platform_interface: ^2.1.8
  image_picker_platform_interface: ^2.11.0
