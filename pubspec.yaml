name: device_io
version: 0.0.1
publish_to: none
description: >
  Cross-platform device IO abstraction for Flutter.
  Unified interfaces for image/file picking, sharing, downloading,
  and opening files — works identically on iOS, Android, macOS,
  Windows, Linux, and web.

# Shared package at the workspace root — consumed by path from sewali + bokumi.
# Not a Dart pub workspace member (no `resolution: workspace`).

environment:
  sdk: ">=3.11.0-0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2     # Asset/image picking
  file_picker: ^11.0.2     # Generic file picking + save dialogs
  share_plus: ^12.0.0      # OS share sheet (13.x needs win32 ^6; blocked
                           # until file_picker >=12 stable drops win32 ^5)
  path_provider: ^2.1.5    # Downloads directory
  web: ^1.1.0              # Web APIs (file input, share, blob)
  open_filex: ^4.6.0       # Open files in external apps
  mime: ^2.0.0             # Full MIME database behind the curated maps
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.3
  test: ^1.31.0
